name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check (config + lib)
        # AGENTS.md is shared Solid Systems markdown — exclude from project Prettier
        run: npx prettier --check "src/lib/**/*.{ts,tsx}" "package.json" "vitest.config.ts" ".prettierrc" "README.md" "docs/ARCHITECTURE.md" ".github/workflows/ci.yml"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Prisma generate
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          # Build does not need a live DB; client is generated above.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
          SESSION_SECRET: ci-session-secret-not-for-production-use
